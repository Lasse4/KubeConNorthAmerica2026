---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mock-llm-backend
  namespace: kserve-test
spec:
  ai:
    groups:
      - providers:
          - name: self-hosted
            custom:
              backendRef:
                group: inference.networking.k8s.io
                kind: InferencePool
                name: mock-llm-inference-pool
              model: mock-llm
              formats:
                - type: Completions
                  path: /v1/chat/completions
      - providers:
          - name: cloud
            custom:
              backendRef:
                kind: Service
                name: cloud-llm
                port: 8000
              model: cloud-llm
              formats:
                - type: Completions
                  path: /v1/chat/completions
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: failover-health
  namespace: kserve-test
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mock-llm-backend
  backend:
    health:
      unhealthyCondition: response.code >= 500 || response.code == 429
      eviction:
        duration: 10s
        consecutiveFailures: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-llm
  namespace: kserve-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-llm
  template:
    metadata:
      labels:
        app: cloud-llm
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0-rc3
          command: ["/app/llm-d-inference-sim"]
          args: ["--model", "cloud-llm", "--port", "8000", "--mode", "echo", "--max-model-len", "32768"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-llm
  namespace: kserve-test
spec:
  selector:
    app: cloud-llm
  ports:
    - port: 8000
      targetPort: 8000
