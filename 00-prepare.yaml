---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kserve-ingress-gateway
  namespace: kserve
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
  infrastructure:
    labels:
      serving.kserve.io/gateway: kserve-ingress-gateway
    # modelCatalog only works on Gateway-level parameters, not on the GatewayClass.
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: kserve-ingress-gateway
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: kserve-ingress-gateway
  namespace: kserve
spec:
  logging:
    format: text          # key=value access log lines, read by the demo scripts
  modelCatalog:
    sources:
      - configMap:
          name: model-catalog
          key: catalog.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-catalog
  namespace: kserve      # must be the Gateway's namespace
data:
  catalog.json: |
    {
      "providers": {
        "custom": {
          "models": {
            "mock-llm": {
              "rates": { "input": "0.40", "output": "0.40" }
            },
            "cloud-llm": {
              "rates": { "input": "2.50", "output": "10.00" }
            }
          }
        }
      }
    }
---
apiVersion: v1
kind: Namespace
metadata:
  name: ratelimit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ratelimit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ratelimit
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  namespace: ratelimit
data:
  config.yaml: |
    domain: team-budgets
    descriptors:
      - key: team
        rate_limit:
          unit: hour
          requests_per_unit: 60000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit
  namespace: ratelimit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratelimit
  template:
    metadata:
      labels:
        app: ratelimit
    spec:
      containers:
        - name: ratelimit
          # pinned to the commit the demo was tested with. A tag, not a digest:
          # images loaded from offline/ only keep their tag.
          image: envoyproxy/ratelimit:5ae0682e
          command: ["/bin/ratelimit"]
          env:
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: redis:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: USE_STATSD
              value: "false"
          ports:
            - containerPort: 8081
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit
  namespace: ratelimit
spec:
  selector:
    app: ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: Service
metadata:
  name: kserve-ingress-gateway-local
  namespace: kserve
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: kserve-ingress-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
