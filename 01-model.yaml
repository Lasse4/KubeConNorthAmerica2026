apiVersion: v1
kind: Namespace
metadata:
  name: kserve-test
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: mock-llm
  namespace: kserve-test
spec:
  model:
    name: mock-llm
    uri: hf://mock/mock-llm
  replicas: 1
  storageInitializer:
    enabled: false
  router:
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0-rc3
        command:
          - /app/llm-d-inference-sim
        args:
          - --model
          - mock-llm
          - --port
          - "8000"
          - --mode
          - echo
          # Not in the guide: the default 1,024-token context is too small
          # for ML research's prompts.
          - --max-model-len
          - "32768"
        ports:
          - name: http
            containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
