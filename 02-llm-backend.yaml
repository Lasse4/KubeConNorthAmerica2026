apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mock-llm-backend
  namespace: kserve-test
spec:
  ai:
    provider:
      custom:
        backendRef:
          group: inference.networking.k8s.io
          kind: InferencePool
          name: mock-llm-inference-pool
        model: mock-llm
        formats:
          - type: Completions
            path: /v1/chat/completions
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: mock-llm
  namespace: kserve-test
spec:
  model:
    name: mock-llm
    uri: hf://mock/mock-llm
  replicas: 1
  storageInitializer:
    enabled: false
  router:
    route:
      http:
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: kserve-ingress-gateway
              namespace: kserve
          rules:
            - backendRefs:
                - group: agentgateway.dev
                  kind: AgentgatewayBackend
                  name: mock-llm-backend
              matches:
                - path:
                    type: PathPrefix
                    value: /v1/chat/completions
              timeouts:
                backendRequest: 0s
                request: 0s
    scheduler: {}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0-rc3
        command:
          - /app/llm-d-inference-sim
        args:
          - --model
          - mock-llm
          - --port
          - "8000"
          - --mode
          - echo
          - --max-model-len
          - "32768"
        ports:
          - name: http
            containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
